[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcript-cascade-mcp"
version = "1.0.0"
description = "Non-invasive, cookie-free YouTube transcript cascade MCP server for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "etrnya"}]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
local-asr = ["openai-whisper", "faster-whisper"]

[project.scripts]
yt-transcript-cascade-mcp = "yt_transcript_cascade.server:main"

[tool.setuptools.packages.find]
where = ["src"]
